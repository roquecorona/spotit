<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d6fd8">
<meta name="description" content="Spot It! The road trip car spotting game: Teslas, Cybertrucks, Cybercabs and Waymos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spot It!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spot It!</title>
<style>
  /* One committed look: a sunny highway, chunky sign-yellow buttons. No outside fonts, so it works offline. */
  :root {
    color-scheme: light;
    --sky: #7cc8ff;
    --road: #3a3d44;
    --sign: #ffd23f;
    --ink: #17202e;
    --go: #2fbf5b;
    --stop: #e8463a;
    --card: #ffffff;
    --soft: #eef6ff;
    --font: "Arial Rounded MT Bold", "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky); color: var(--ink); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .screen { position: fixed; inset: 0; z-index: 10; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 14px; background: linear-gradient(180deg, rgba(124,200,255,.94), rgba(214,239,255,.96)); touch-action: pan-y; }
  .screen > * { flex-shrink: 0; }
  .logo { font-size: clamp(54px, 12vw, 110px); font-weight: 900; color: var(--sign); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); transform: rotate(-3deg); margin: 6px 0 0; letter-spacing: 1px; line-height: 1; }
  .sub { font-size: 20px; font-weight: 800; text-align: center; max-width: 640px; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; width: min(760px, 100%); }
  .big { border: 4px solid var(--ink); border-radius: 22px; background: var(--card); box-shadow: 0 6px 0 var(--ink); padding: 14px; font-size: 26px; font-weight: 900; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .big small { font-size: 15px; font-weight: 700; color: #4a5568; }
  .big.yellow { background: var(--sign); }
  .big.green { background: var(--go); color: #fff; }
  .big.green small { color: #eafff0; }
  .big:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .pill { border: 3px solid var(--ink); border-radius: 999px; background: var(--card); padding: 8px 16px; font-size: 18px; font-weight: 900; box-shadow: 0 4px 0 var(--ink); color: var(--ink); }
  .pill.on { background: var(--sign); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: min(760px, 100%); }
  .target { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; }
  .target canvas { width: 100%; max-width: 170px; height: auto; aspect-ratio: 2 / 1; }
  .target .pts { background: var(--sign); border: 3px solid var(--ink); border-radius: 999px; padding: 0 12px; font-size: 20px; }
  .panel { background: var(--card); border: 4px solid var(--ink); border-radius: 22px; padding: 16px; width: min(760px, 100%); box-shadow: 0 6px 0 var(--ink); }
  h2 { margin: 0 0 8px; font-size: 30px; font-weight: 900; text-align: center; }
  .tip { font-size: 16px; font-weight: 700; color: #4a5568; text-align: center; }

  /* in-game HUD */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #score { position: absolute; left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--card); border: 4px solid var(--ink); border-radius: 18px; padding: 4px 16px; font-size: 40px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #timebar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); width: min(42vw, 360px); height: 26px; background: var(--card); border: 4px solid var(--ink); border-radius: 999px; overflow: hidden; }
  #timebar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--go), var(--sign)); }
  #timetext { position: absolute; left: 50%; transform: translateX(-50%); top: calc(46px + env(safe-area-inset-top, 0px)); font-size: 20px; font-weight: 900; color: var(--ink); text-shadow: 0 2px 0 #fff; }
  #pause { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); pointer-events: auto; width: 64px; height: 58px; border-radius: 16px; border: 4px solid var(--ink); background: var(--card); font-size: 26px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); }
  #legend { position: absolute; left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(84px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; }
  #legend div { background: rgba(255,255,255,.88); border: 3px solid var(--ink); border-radius: 12px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; }
  #legend canvas { width: 54px; height: 27px; }
  @media (max-height: 520px) { #legend { display: none; } #score { font-size: 30px; } }

  /* tally */
  .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; width: min(1100px, 100%); }
  .player { background: var(--card); border: 4px solid var(--ink); border-radius: 22px; padding: 12px; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; gap: 10px; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pname { font-size: 26px; font-weight: 900; }
  .ptotal { font-size: 44px; font-weight: 900; background: var(--sign); border: 4px solid var(--ink); border-radius: 16px; padding: 0 14px; font-variant-numeric: tabular-nums; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tbtn { border: 3px solid var(--ink); border-radius: 16px; background: var(--soft); padding: 6px; display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 16px; color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .tbtn canvas { width: 100%; max-width: 140px; height: auto; aspect-ratio: 2 / 1; }
  .tbtn .c { font-size: 14px; color: #4a5568; }
  .tbtn:active { transform: translateY(4px); box-shadow: none; }
  .tbtn.flash { background: var(--sign); }
  input[type=text] { font: 900 22px var(--font); padding: 10px 14px; border: 4px solid var(--ink); border-radius: 14px; width: min(320px, 80vw); color: var(--ink); user-select: text; -webkit-user-select: text; }
  .scoreTable { width: 100%; border-collapse: collapse; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .scoreTable td { padding: 6px 8px; border-bottom: 2px solid #e2e8f0; }
  .scoreTable td:last-child { text-align: right; }
  .burst { position: fixed; pointer-events: none; z-index: 30; font-size: 28px; animation: fall 1.6s linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(500deg); } }
  @media (prefers-reduced-motion: reduce) { .burst { display: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Highway"></canvas>

<div id="hud" hidden>
  <div id="score">0</div>
  <div id="timebar"><i id="timefill"></i></div>
  <div id="timetext">60</div>
  <div id="legend"></div>
  <button id="pause" aria-label="Pause">II</button>
</div>

<div class="screen" id="sHome"></div>
<div class="screen" id="sPlay" hidden></div>
<div class="screen" id="sPause" hidden></div>
<div class="screen" id="sOver" hidden></div>
<div class="screen" id="sTally" hidden></div>
<div class="screen" id="sGuide" hidden></div>
<div class="screen" id="sScores" hidden></div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);

  // ================================================================ the vehicles
  const TARGETS = {
    tesla:      { name: "Tesla",      pts: 3 },
    waymo:      { name: "Waymo",      pts: 5 },
    cybertruck: { name: "Cybertruck", pts: 6 },
    cybercab:   { name: "Cybercab",   pts: 7 },

  const ORDER = ["tesla", "waymo", "cybertruck", "cybercab"];
  const DECOYS = ["sedan", "sedan", "suv", "suv", "pickup", "van", "hatch", "taxi", "sports", "bus"];
  const PAINT = {
    tesla: ["#f4f5f7", "#1b1e24", "#c8202f", "#1f3f8f", "#7d8590"],

    hatch: ["#e67e22", "#16a085", "#8e44ad", "#f1c40f", "#2e86de"],

  // Every vehicle is drawn facing right, wheels on y = 0, about L wide.
  function wheel(g, x, r, ang, style) {

      g.quadraticCurveTo(0.53 * L, -0.27 * L, 0.4 * L, -0.3 * L);
      g.lineTo(0.17 * L, -0.33 * L);
      g.quadraticCurveTo(0.04 * L, -0.5 * L, -0.12 * L, -0.5 * L);

      g.moveTo(0.14 * L, -0.34 * L); g.quadraticCurveTo(0.03 * L, -0.48 * L, -0.12 * L, -0.48 * L);

      g.moveTo(0.26 * L, -0.31 * L); g.quadraticCurveTo(0.14 * L, -0.42 * L, 0.04 * L, -0.48 * L);

      g.fillStyle = "#ffffff"; g.shadowColor = "#fff"; g.shadowBlur = L * 0.04; g.fillRect(0.4 * L, -0.24 * L, 0.06 * L, 0.012 * L); g.shadowBlur = 0;
      g.fillStyle = "#e33"; g.fillRect(-0.46 * L, -0.27 * L, 0.03 * L, 0.012 * L);
      wheel(g, 0.25 * L, 0.09 * L, ang, "gold"); wheel(g, -0.27 * L, 0.09 * L, ang, "gold");
    } else if (kind === "waymo") {
      g.fillStyle = bodyFill(g, "#f4f6f8", L); g.beginPath();
      g.moveTo(0.5 * L, -0.15 * L); g.quadraticCurveTo(0.53 * L, -0.3 * L, 0.4 * L, -0.33 * L);
      g.lineTo(0.2 * L, -0.36 * L); g.quadraticCurveTo(0.08 * L, -0.52 * L, -0.08 * L, -0.52 * L);
      g.lineTo(-0.3 * L, -0.5 * L); g.quadraticCurveTo(-0.46 * L, -0.46 * L, -0.5 * L, -0.33 * L);
      g.lineTo(-0.5 * L, -0.15 * L); g.quadraticCurveTo(-0.5 * L, -0.1 * L, -0.45 * L, -0.1 * L); g.lineTo(0.45 * L, -0.1 * L); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = TINT; poly(g, [[0.17, -0.37], [0.07, -0.49], [-0.29, -0.48], [-0.42, -0.37]], L); g.fill();
      g.fillStyle = "#e5e9ee"; g.fillRect(-0.06 * L, -0.49 * L, 0.025 * L, 0.12 * L);
      // the spinning sensor on the roof is how you know it is a Waymo

      g.strokeStyle = "#20b2c8"; g.lineWidth = L * 0.018; g.beginPath(); g.arc(-0.07 * L, -0.2 * L, 0.05 * L, Math.PI * 0.15, Math.PI * 0.85); g.stroke();

    const b = el("button", { class: "pill" + (data.sound ? " on" : ""), onclick: () => { data.sound = !data.sound; save(); b.className = "pill" + (data.sound ? " on" : ""); b.textContent = data.sound ? "Sound: ON" : "Sound: OFF"; } }, data.sound ? "Sound: ON" : "Sound: OFF");
    return b;
  }
  function home() {
    state = "menu"; $("hud").hidden = true; cars.length = 0; pops.length = 0;
    const s = $("sHome"); s.innerHTML = "";
    s.append(el("div", { class: "logo" }, "SPOT IT!"),
      el("div", { class: "sub" }, "The road trip car spotting game"),
      targetCards(true),
      el("div", { class: "menu" },
        el("button", { class: "big green", onclick: () => { Snd.click(); levelPick(); } }, "▶ PLAY", el("small", null, "Tap the cars as they drive by")),
        el("button", { class: "big yellow", onclick: () => { Snd.click(); tally(); } }, "ROAD TRIP TALLY", el("small", null, "Keep score of real cars in the car")),
        el("button", { class: "big", onclick: () => { Snd.click(); guide(); } }, "CAR GUIDE", el("small", null, "Learn which car is which")),
        el("button", { class: "big", onclick: () => { Snd.click(); scores(); } }, "HIGH SCORES", el("small", null, "Best games on this tablet"))),
      el("div", { class: "row" }, soundBtn()));
    show("sHome");
  }
  function levelPick() {
    const s = $("sPlay"); s.innerHTML = "";
    s.append(el("h2", null, "How fast?"));
    const m = el("div", { class: "menu" });
    [["easy", "Slow cars, lots of targets"], ["normal", "Just right"], ["hard", "Fast cars, and tapping a wrong car costs 2 points"]].forEach(([k, d]) =>
      m.append(el("button", { class: "big" + (k === data.level ? " yellow" : ""), onclick: () => { data.level = k; save(); start(); } }, LEVELS[k].name.toUpperCase(), el("small", null, d))));
    s.append(m, el("div", { class: "tip" }, "Tap only Teslas, Waymos, Cybertrucks and Cybercabs. Every other car is a trick!"),
      el("button", { class: "pill", onclick: home }, "← Back"));
    show("sPlay");
  }
  function start() {
    lv = LEVELS[data.level]; sky = SKIES[Math.floor(Math.random() * SKIES.length)];
    cars.length = 0; pops.length = 0; score = 0; timeLeft = lv.time; spawnT = [0.3, 0.8];
    round = { counts: {}, streak: 0, best: 0, misses: 0, missed: 0, lastSec: -1 };
    $("score").textContent = "0";
    const lg = $("legend"); lg.innerHTML = "";
    ORDER.forEach(k => lg.append(el("div", null, thumb(k, 54), TARGETS[k].pts)));
    $("hud").hidden = false; show(null); state = "play"; Snd.start();
  }
  $("pause").addEventListener("pointerdown", e => { e.preventDefault(); if (state !== "play") return; state = "paused"; Snd.click();
    const s = $("sPause"); s.innerHTML = "";
    s.append(el("h2", null, "Paused"), el("div", { class: "panel", style: "text-align:center;font-size:28px;font-weight:900" }, "Score: " + score),
      el("div", { class: "menu" }, el("button", { class: "big green", onclick: () => { show(null); state = "play"; } }, "▶ KEEP PLAYING"), el("button", { class: "big", onclick: home }, "HOME")));
    show("sPause"); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") $("pause").dispatchEvent(new PointerEvent("pointerdown")); });

  function confetti(n) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < n; i++) { const b = el("span", { class: "burst", style: "left:" + Math.random() * 100 + "vw;top:-40px;animation-duration:" + (1.4 + Math.random()) + "s" }, ["⭐", "🎉", "✨", "🚗"][i % 4]); document.body.append(b); setTimeout(() => b.remove(), 2600); }
  }
  function endRound() {
    state = "over"; $("hud").hidden = true; Snd.end();
    Object.keys(round.counts).forEach(k => { data.lifetime[k] = (data.lifetime[k] || 0) + round.counts[k]; });
    const list = data.best[data.level] = data.best[data.level] || [];
    const rank = list.filter(r => r.score >= score).length;
    const makesBoard = score > 0 && rank < 5;
    save();
    const s = $("sOver"); s.innerHTML = "";
    s.append(el("div", { class: "logo", style: "font-size:clamp(40px,9vw,80px)" }, rank === 0 && score > 0 ? "NEW BEST!" : "TIME'S UP!"));
    const panel = el("div", { class: "panel" }, el("h2", null, score + " points"));
    const tbl = el("table", { class: "scoreTable" });
    ORDER.forEach(k => { const n = round.counts[k] || 0; tbl.append(el("tr", null, el("td", null, TARGETS[k].name), el("td", null, n + " × " + TARGETS[k].pts), el("td", null, n * TARGETS[k].pts))); });
    panel.append(tbl, el("div", { class: "tip", style: "margin-top:8px" }, "Best streak: " + round.best + "   ·   Missed targets: " + round.missed + (round.misses ? "   ·   Wrong taps: " + round.misses : "")));
    s.append(panel);
    if (makesBoard) {
      const name = el("input", { type: "text", id: "nameIn", maxlength: "12", placeholder: "Your name", value: data.lastName || "", "aria-label": "Your name" });
      const keep = () => { const n = name.value.trim() || "Player"; data.lastName = n; list.splice(rank, 0, { name: n, score, date: Date.now() }); list.length = Math.min(list.length, 5); save(); add.disabled = true; add.textContent = "Saved!"; };
      const add = el("button", { class: "pill on", onclick: keep }, "Save my score");
      s.append(el("div", { class: "row" }, name, add));
    }
    s.append(el("div", { class: "menu" }, el("button", { class: "big green", onclick: start }, "▶ PLAY AGAIN"), el("button", { class: "big", onclick: home }, "HOME")));
    show("sOver");
    if (score > 0) confetti(rank === 0 ? 40 : 18);
  }
  function scores() {
    const s = $("sScores"); s.innerHTML = "";
    s.append(el("h2", null, "High scores"));
    Object.keys(LEVELS).forEach(k => {
      const p = el("div", { class: "panel" }, el("h2", { style: "font-size:24px" }, LEVELS[k].name));
      const list = data.best[k] || [];
      if (!list.length) p.append(el("div", { class: "tip" }, "No scores yet."));
      else { const t = el("table", { class: "scoreTable" }); list.forEach((r, i) => t.append(el("tr", null, el("td", null, (i + 1) + ". " + r.name), el("td", null, r.score)))); p.append(t); }
      s.append(p);
    });
    const life = el("div", { class: "panel" }, el("h2", { style: "font-size:24px" }, "Cars spotted on this tablet"));
    const t = el("table", { class: "scoreTable" }); ORDER.forEach(k => t.append(el("tr", null, el("td", null, TARGETS[k].name), el("td", null, data.lifetime[k] || 0)))); life.append(t);
    s.append(life, el("button", { class: "pill", onclick: home }, "← Back"));
    show("sScores");
  }
  function guide() {
    const s = $("sGuide"); s.innerHTML = "";
    const tips = {
      tesla: "Smooth and sleek, with no grille on the front and one long dark glass roof. Comes in white, black, red, blue and grey.",
      waymo: "A white car that drives itself, with a spinning sensor tower on the roof and little cameras on the corners.",
      cybertruck: "Shiny silver and pointy like a triangle, with a light bar across the front.",
      cybercab: "A small gold two-seater with no steering wheel, shaped like a teardrop.",
    };
    s.append(el("h2", null, "Car Guide"));
    ORDER.forEach(k => s.append(el("div", { class: "panel", style: "display:flex;gap:14px;align-items:center;flex-wrap:wrap" }, thumb(k, 220),
      el("div", { style: "flex:1;min-width:200px" }, el("div", { style: "font-size:28px;font-weight:900" }, TARGETS[k].name + "  ", el("span", { class: "pts", style: "background:#ffd23f;border:3px solid #17202e;border-radius:999px;padding:0 10px" }, TARGETS[k].pts + " pts")),
        el("div", { style: "font-size:18px;font-weight:700" }, tips[k])))));
    const fakes = el("div", { class: "panel" }, el("h2", { style: "font-size:24px" }, "Tricky cars that are NOT worth points"));
    const fr = el("div", { class: "targets" });
    ["sedan", "suv", "pickup", "sports"].forEach(k => fr.append(el("div", { class: "target" }, thumb(k, 170), { sedan: "Regular car (has a grille)", suv: "White SUV (no roof sensor)", pickup: "Regular pickup", sports: "Sports car" }[k])));
    fakes.append(fr);
    s.append(fakes, el("button", { class: "pill", onclick: home }, "← Back"));
    show("sGuide");
  }

  // ================================================================ road trip tally (the real game, in the car)
  const COLORS = ["#2e86de", "#e8463a", "#2fbf5b", "#8e44ad"];
  function tallyState() { if (!data.tally) data.tally = { players: [{ name: "Player 1", counts: {}, total: 0 }, { name: "Player 2", counts: {}, total: 0 }], log: [] }; return data.tally; }
  function tally() {
    state = "tally"; $("hud").hidden = true;
    const T = tallyState();
    const s = $("sTally"); s.innerHTML = "";
    s.append(el("h2", null, "Road Trip Tally"), el("div", { class: "tip" }, "Saw one out the window? Tap it under your name."));
    const grid = el("div", { class: "players" });
    T.players.forEach((p, pi) => {
      const card = el("div", { class: "player", style: "border-color:" + COLORS[pi % 4] + ";box-shadow:0 6px 0 " + COLORS[pi % 4] });
      const nm = el("div", { class: "pname", style: "color:" + COLORS[pi % 4], role: "button", tabindex: "0", title: "Tap to rename" }, p.name);
      nm.addEventListener("click", () => {
        const inp = el("input", { type: "text", value: p.name, maxlength: "12", "aria-label": "Player name" });
        nm.replaceWith(inp); inp.focus(); inp.select();
        const done = () => { p.name = inp.value.trim() || p.name; save(); tally(); };
        inp.addEventListener("blur", done); inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
      });
      card.append(el("div", { class: "phead" }, nm, el("div", { class: "ptotal" }, p.total)));
      const bt = el("div", { class: "tbtns" });
      ORDER.forEach(k => {
        const b = el("button", { class: "tbtn", "aria-label": "Add a " + TARGETS[k].name + " for " + p.name }, thumb(k, 140), "+" + TARGETS[k].pts + " " + TARGETS[k].name, el("span", { class: "c" }, "× " + (p.counts[k] || 0)));
        b.addEventListener("click", () => {
          p.counts[k] = (p.counts[k] || 0) + 1; p.total += TARGETS[k].pts; T.log.push([pi, k]); if (T.log.length > 200) T.log.shift(); save();
          Snd.spot(TARGETS[k].pts);
          b.querySelector(".c").textContent = "× " + p.counts[k]; card.querySelector(".ptotal").textContent = p.total;
          b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 250);
          if (p.total >= 100 && p.total - TARGETS[k].pts < 100) confetti(30);
        });
        bt.append(b);
      });
      card.append(bt);
      if (T.players.length > 1) card.append(el("button", { class: "pill", style: "align-self:flex-end;font-size:14px;padding:4px 10px", onclick: () => { T.players.splice(pi, 1); T.log = []; save(); tally(); } }, "Remove player"));
      grid.append(card);
    });
    s.append(grid);
    let armed = false;
    const reset = el("button", { class: "pill", onclick: () => {
      if (!armed) { armed = true; reset.textContent = "Tap again to start over"; setTimeout(() => { armed = false; reset.textContent = "New trip (scores to 0)"; }, 3000); return; }
      T.players.forEach(p => { p.counts = {}; p.total = 0; }); T.log = []; save(); tally();
    } }, "New trip (scores to 0)");
    s.append(el("div", { class: "row" },
      el("button", { class: "pill on", onclick: () => { const last = T.log.pop(); if (!last) return; const p = T.players[last[0]], k = last[1]; if (p) { p.counts[k] = Math.max(0, (p.counts[k] || 0) - 1); p.total = Math.max(0, p.total - TARGETS[k].pts); } save(); tally(); } }, "↶ Undo last"),
      T.players.length < 4 ? el("button", { class: "pill", onclick: () => { T.players.push({ name: "Player " + (T.players.length + 1), counts: {}, total: 0 }); save(); tally(); } }, "+ Add player") : null,
      reset, el("button", { class: "pill", onclick: home }, "← Home")));
    show("sTally");
  }

  if (location.hash === "#test") window.__spot = { get state() { return state; }, get score() { return score; }, cars, tap, start, endRound, levelPick, home, tally, laneInfo, bbox, set time(v) { timeLeft = v; } };
  home();
  requestAnimationFrame(frame);
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
